# cln-ntfy message template
#
# This file defines custom title/message/tags for ntfy notifications.
# Point CLN at it with:  ntfy-template-file=/path/to/ntfy-template.conf
#
# Format:
#   [event_name]          # one section per CLN event, or [default] for all
#   title = "..."         # ntfy notification title
#   message = "..."       # ntfy notification body
#   tags = ["tag1", ...]  # ntfy emoji tags
#
# Placeholders (replaced at send time):
#   {{event}}             # the event name, e.g. "invoice_payment"
#   {{json}}              # the full raw notification JSON
#   {{path.to.field}}     # dotted path into the notification JSON
#                         # e.g. {{invoice_payment.msat}}, {{forward_event.status}}
#                         # missing paths resolve to an empty string
#
# WARNING: {{json}} expands to the FULL raw notification payload, which can
# contain sensitive data: payment preimages, invoice labels/descriptions,
# on-chain UTXOs and txids (coin_movement), and peer IDs. Only use it when
# publishing to a trusted, access-restricted ntfy server and an unguessable
# topic — never to a public topic on a shared server.
#
# Available event sections:
#   channel_opened, channel_state_changed, connect, disconnect,
#   invoice_creation, invoice_payment, forward_event, sendpay_success,
#   sendpay_failure, coin_movement, warning, block_added

# Fallback for any event without its own section below.
[default]
title = "CLN: {{event}}"

# --- Channel events ---

[channel_opened]
title = "Channel opened"
message = "Funding: {{channel_opened.funding_msat}} msat"
tags = ["white_check_mark"]

[channel_state_changed]
title = "Channel state: {{channel_state_changed.new_state}}"
message = "{{channel_state_changed.old_state}} -> {{channel_state_changed.new_state}} ({{channel_state_changed.cause}})"
tags = ["arrows_counterclockwise"]

# --- Payment events ---

[invoice_creation]
title = "Invoice created"
message = "Label: {{invoice_creation.label}}, Amount: {{invoice_creation.msat}}"
tags = ["hourglass"]

[invoice_payment]
title = "Payment received"
message = "+{{invoice_payment.msat}} msat ({{invoice_payment.label}})"
tags = ["zap", "money"]

[forward_event]
title = "Forward {{forward_event.status}}"
message = "In: {{forward_event.in_msat}}, Out: {{forward_event.out_msat}}, Fee: {{forward_event.fee_msat}}"
tags = ["repeat"]

[sendpay_success]
title = "Payment sent"
tags = ["outbox_tray"]

[sendpay_failure]
title = "Payment failed"
message = "{{sendpay_failure.message}}"
tags = ["warning"]

# --- Node events ---

[connect]
title = "Peer connected"
message = "Peer: {{connect.id}}"
tags = ["electric_plug"]

[disconnect]
title = "Peer disconnected"
message = "Peer: {{disconnect.id}}"
tags = ["x"]

[coin_movement]
title = "Coin movement"
message = "{{coin_movement.type}}: {{coin_movement.account_id}}"
tags = ["coin"]

[warning]
title = "Warning"
message = "{{warning.message}}"
tags = ["warning"]

[block_added]
title = "Block #{{block_added.height}}"
tags = ["bricks"]
