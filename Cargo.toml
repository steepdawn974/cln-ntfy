[package]
name = "cln-ntfy"
version = "0.2.0"
edition = "2024"
rust-version = "1.85.0"
description = "CLN plugin for ntfy"
authors = ["Yuki Kishimoto <yukikishimoto@proton.me>"]
license = "MIT"
homepage = "https://github.com/yukibtc/cln-ntfy"
repository = "https://github.com/yukibtc/cln-ntfy.git"
readme = "README.md"
keywords = ["cln", "ntfy", "bitcoin", "lightning"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
log = "0.4"
ntfy = { version = "0.9", features = ["socks"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "sync", "rt-multi-thread"] }
url = { version = "2", features = ["serde"] }

cln-plugin = "0.6"

[profile.release]
lto = true
codegen-units = 1

[profile.optimized]
inherits = "release"
strip = "debuginfo"
codegen-units = 1
lto = "fat"
debug = false
